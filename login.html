<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>로그인 — COZYADD 코지애드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112..125,600..800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="logo" href="/">COZYADD<span>.</span></a>
      <nav class="menu" aria-label="주 메뉴">
        <a href="lookbook.html">룩북</a>
        <a href="/#contact">문의</a>
        <a href="login.html" aria-current="page">로그인</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="wrap narrow">
      <h1>로그인</h1>
      <p class="lead">회원 전용 혜택 안내를 보려면 로그인해 주세요.</p>
      <form id="login-form" class="form" novalidate>
        <label>이메일<input type="email" name="email" autocomplete="email" required></label>
        <label>비밀번호<input type="password" name="password" autocomplete="current-password" required></label>
        <p id="login-msg" class="msg" role="status" hidden></p>
        <div class="btns">
          <button class="btn btn-main" type="submit">로그인</button>
          <button class="btn" type="button" id="recover">비밀번호 찾기</button>
        </div>
      </form>
      <p class="small-links" style="margin-top:28px">아직 회원이 아니면 <a href="signup.html">회원가입</a></p>
    </div>
  </main>

  <script src="assets/auth.js"></script>
</body>
</html>
