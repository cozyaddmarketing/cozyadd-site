<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>관리자 — COZYADD</title>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@700&f[]=satoshi@400,500,700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    body { background: var(--ground); }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); }
    .bar strong { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: -.03em; font-size: 22px; }
    .tabs { display: flex; gap: 8px; margin: 20px 0; }
    .tabs button[aria-selected="true"] { background: var(--ink); color: var(--ground); }
    .count { font-family: var(--display); letter-spacing: -.04em; font-size: 2.6rem; font-weight: 700; line-height: 1; margin: 8px 0 4px; }
    .count-label { color: var(--muted); margin: 0 0 24px; }
    .cards { display: grid; gap: 12px; padding-bottom: 64px; }
    .card { background: var(--ground-2); border: 1px solid var(--line); padding: 18px; display: grid; gap: 8px; }
    .card .when { color: var(--muted); font-size: .9rem; }
    .card .who { font-weight: 600; font-size: 1.05rem; }
    .copy { font: inherit; background: none; border: 0; padding: 0; color: var(--cognac); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; text-align: left; min-height: 32px; }
    .card .body { white-space: pre-wrap; margin: 0; }
    .states { display: flex; flex-wrap: wrap; gap: 8px; }
    .states .btn { min-height: 44px; padding: 0 16px; }
    .states .btn[aria-pressed="true"] { background: var(--cognac); border-color: var(--cognac); color: var(--ground); }
    .card.new { border-left: 3px solid var(--cognac); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <strong>COZYADD 관리자</strong>
      <button id="logout" class="btn" type="button" hidden>나가기</button>
    </div>

    <form id="login" class="form page narrow">
      <label>관리자 비밀번호<input type="password" name="pw" autocomplete="current-password" required></label>
      <p id="login-msg" class="msg err" role="alert" hidden></p>
      <div><button class="btn btn-main" type="submit">들어가기</button></div>
    </form>

    <div id="app" hidden>
      <div class="tabs" role="tablist">
        <button class="btn" type="button" role="tab" data-tab="inq" aria-selected="true">문의함</button>
        <button class="btn" type="button" role="tab" data-tab="mem" aria-selected="false">회원</button>
      </div>

      <section id="tab-inq" style="padding:0">
        <div class="count" id="new-count">0</div>
        <p class="count-label">새 문의</p>
        <p id="inq-msg" class="msg err" role="alert" hidden></p>
        <div class="cards" id="inq-list"></div>
      </section>

      <section id="tab-mem" style="padding:0" hidden>
        <div class="count" id="mem-count">0</div>
        <p class="count-label">회원 (삭제·비밀번호 변경은 Supabase 화면에서 해요)</p>
        <p id="mem-msg" class="msg err" role="alert" hidden></p>
        <div class="cards" id="mem-list"></div>
      </section>
    </div>
  </div>

  <script>
    const KEY = 'cozyadd_admin_pw';
    const STATUSES = ['새 문의', '연락함', '완료'];
    const $ = (id) => document.getElementById(id);
    const fmt = (s) => s ? new Date(s).toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' }) : '-';

    async function call(path, opts = {}) {
      const pw = sessionStorage.getItem(KEY) || '';
      const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'x-admin-password': pw, ...(opts.headers || {}) } });
      const data = await r.json().catch(() => ({}));
      if (r.status === 401) { showLogin('비밀번호가 맞지 않아요.'); throw new Error('401'); }
      if (!r.ok) throw new Error(data.error || '불러오지 못했어요.');
      return data;
    }

    function showLogin(err) {
      sessionStorage.removeItem(KEY);
      $('app').hidden = true; $('logout').hidden = true; $('login').hidden = false;
      const m = $('login-msg');
      m.hidden = !err; m.textContent = err || '';
      const input = $('login').elements['pw'];
      input.value = ''; input.focus();
    }

    function el(tag, cls, text) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    }

    async function loadInquiries() {
      const msg = $('inq-msg'); msg.hidden = true;
      try {
        const { rows } = await call('/api/admin');
        $('new-count').textContent = rows.filter((r) => r.status === '새 문의').length;
        const list = $('inq-list'); list.innerHTML = '';
        if (!rows.length) list.append(el('p', 'count-label', '아직 들어온 문의가 없어요.'));
        rows.forEach((row) => {
          const card = el('article', 'card' + (row.status === '새 문의' ? ' new' : ''));
          card.append(el('div', 'when', fmt(row.created_at)), el('div', 'who', row.name));
          const copy = el('button', 'copy', row.contact);
          copy.type = 'button';
          copy.addEventListener('click', async () => {
            try { await navigator.clipboard.writeText(row.contact); copy.textContent = row.contact + ' (복사됨)'; }
            catch { const s = getSelection(); const rg = document.createRange(); rg.selectNodeContents(copy); s.removeAllRanges(); s.addRange(rg); }
          });
          card.append(copy);
          if (row.message) card.append(el('p', 'body', row.message));
          const states = el('div', 'states');
          STATUSES.forEach((st) => {
            const b = el('button', 'btn', st);
            b.type = 'button';
            b.setAttribute('aria-pressed', String(row.status === st));
            b.addEventListener('click', async () => {
              try { await call('/api/admin', { method: 'PATCH', body: JSON.stringify({ id: row.id, status: st }) }); loadInquiries(); }
              catch (e) { if (e.message !== '401') { msg.textContent = e.message; msg.hidden = false; } }
            });
            states.append(b);
          });
          card.append(states);
          list.append(card);
        });
      } catch (e) { if (e.message !== '401') { msg.textContent = e.message; msg.hidden = false; } }
    }

    async function loadMembers() {
      const msg = $('mem-msg'); msg.hidden = true;
      try {
        const { users } = await call('/api/admin?view=members');
        $('mem-count').textContent = users.length;
        const list = $('mem-list'); list.innerHTML = '';
        if (!users.length) list.append(el('p', 'count-label', '아직 가입한 회원이 없어요.'));
        users.forEach((u) => {
          const card = el('article', 'card');
          card.append(el('div', 'who', u.email), el('div', 'when', '가입 ' + fmt(u.created_at) + ' / 마지막 로그인 ' + fmt(u.last_sign_in_at)));
          list.append(card);
        });
      } catch (e) { if (e.message !== '401') { msg.textContent = e.message; msg.hidden = false; } }
    }

    function showApp() {
      $('login').hidden = true; $('app').hidden = false; $('logout').hidden = false;
      loadInquiries();
    }

    $('login').addEventListener('submit', async (e) => {
      e.preventDefault();
      sessionStorage.setItem(KEY, e.target.elements['pw'].value);
      try { await call('/api/admin'); $('login-msg').hidden = true; showApp(); }
      catch (err) { if (err.message !== '401') showLogin(err.message); }
    });
    $('logout').addEventListener('click', () => showLogin());
    document.querySelectorAll('[data-tab]').forEach((t) => t.addEventListener('click', () => {
      document.querySelectorAll('[data-tab]').forEach((x) => x.setAttribute('aria-selected', String(x === t)));
      const mem = t.dataset.tab === 'mem';
      $('tab-inq').hidden = mem; $('tab-mem').hidden = !mem;
      mem ? loadMembers() : loadInquiries();
    }));

    if (sessionStorage.getItem(KEY)) showApp();
  </script>
</body>
</html>
